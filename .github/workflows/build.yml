name: Build

# Proves the source builds: runs the tests and builds the app the way
# `npm run setup` does on a user's PC (README → Install), on every push and
# pull request. Nothing is published or kept: Candy ships as source, and
# each user compiles their own (README → Install), so what they run is the
# code they can read here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # setup.mjs keeps its own cache outside the folder; here, the cached one.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # Three files carry the version and they drift silently.
      - name: Check every version agrees
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          if ($conf -ne $pkg -or $conf -ne $cargo) { throw "the versions disagree" }

      # Install Candy.cmd as a user double-clicks it (the tools are already on
      # the runner, so it goes straight to npm run setup).
      - name: Build the installer
        shell: pwsh
        run: '& "./Install Candy.cmd" --build-only'

  linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # What README → Install lists for apt.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-layer-shell-dev

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the app
        run: npm run setup -- --build-only

  # The same tests and build on a Mac, then the app itself is started. Rust and
  # Apple's Command Line Tools come with the runner.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # Install Candy.command as a user double-clicks it (the tools are already
      # on the runner, so it goes straight to npm run setup).
      - name: Build the app
        run: '"./Install Candy.command" --build-only'

      # On demand (Actions → Build → Run workflow), not on every push: the
      # runner opens the Candy it just built and goes through the first things
      # a trader does, a screenshot at each step (scripts/mac-check.sh).
      - name: Try Candy on the Mac
        if: github.event_name == 'workflow_dispatch'
        run: |
          brew install cliclick
          bash scripts/mac-check.sh "$CARGO_TARGET_DIR/release/bundle/macos/Candy.app" mac-screenshots

      # Those screenshots, to look at on the build's page for a day: images
      # only, never the app (Candy ships as source).
      - name: Keep the screenshots for a day
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: candy-on-macos
          path: mac-screenshots/*.png
          retention-days: 1
          if-no-files-found: warn
