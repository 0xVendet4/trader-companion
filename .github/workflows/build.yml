name: Build

# Runs the tests and builds the app the way `npm run setup` does on a user's
# computer (README → Install), on every push and pull request. On main, once
# every system is green and the version has no release yet, the Windows
# installer and the Mac app built here are published as that version's
# release (the `release` job): what a user downloads is what this public
# build made from the code they can read here, and a running Candy offers it
# within the hour (src-tauri/src/update.rs).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # setup.mjs keeps its own cache outside the folder; here, the cached one.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # Three files carry the version and they drift silently.
      - name: Check every version agrees
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          if ($conf -ne $pkg -or $conf -ne $cargo) { throw "the versions disagree" }

      # Install Candy.cmd as a user double-clicks it (the tools are already on
      # the runner, so it goes straight to npm run setup).
      - name: Build the installer
        shell: pwsh
        run: '& "./Install Candy.cmd" --build-only'

      - name: Keep the installer for the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/Candy-Windows-*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # What README → Install lists for apt.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-layer-shell-dev

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the app
        run: npm run setup -- --build-only

  # The same tests and build on a Mac, then the app itself is started. Rust and
  # Apple's Command Line Tools come with the runner.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # Install Candy.command as a user double-clicks it (the tools are already
      # on the runner, so it goes straight to npm run setup).
      - name: Build the app
        run: '"./Install Candy.command" --build-only'

      # The release's app runs on Apple Silicon and Intel Macs alike: both
      # halves are built and joined into one bundle, zipped as Finder would.
      - name: Build the universal app for the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npx tauri build --bundles app --target universal-apple-darwin
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ditto -c -k --sequesterRsrc --keepParent "$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/macos/Candy.app" "Candy-macOS-$version.zip"

      - name: Keep the app for the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: Candy-macOS-*.zip
          if-no-files-found: error

      # On demand (Actions → Build → Run workflow), not on every push: the
      # runner opens the Candy it just built and goes through the first things
      # a trader does, a screenshot at each step (scripts/mac-check.sh).
      - name: Try Candy on the Mac
        if: github.event_name == 'workflow_dispatch'
        run: |
          brew install cliclick
          bash scripts/mac-check.sh "$CARGO_TARGET_DIR/release/bundle/macos/Candy.app" mac-screenshots

      # Those screenshots, to look at on the build's page for a day: images
      # only, never the app (Candy ships as source).
      - name: Keep the screenshots for a day
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: candy-on-macos
          path: mac-screenshots/*.png
          retention-days: 1
          if-no-files-found: warn

  # One release per version: when main's version has none yet, the installer
  # and the app the jobs above built are published under its tag (v0.1.16),
  # with the README's line about it as the notes. A version already released
  # is left alone, so a push that changes nothing but code publishes nothing.
  release:
    needs: [windows, linux, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the release, once per version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is published already"
            exit 0
          fi
          notes=$(grep -E "^\| $version \|" README.md | awk -F'|' '{print $4}' | sed 's/^ *//;s/ *$//')
          ls -l assets
          # The notes end with each file's SHA256 and a link to this build, so a
          # download can be checked against what GitHub built from this commit.
          sums=$(cd assets && sha256sum *)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release create "v$version" assets/* --target "$GITHUB_SHA" --title "Candy $version" --latest --notes "${notes:-See the commits.}

          Windows: download the setup.exe and run it (Windows asks once because the installer isn't signed: More info → Run anyway). macOS: unzip, drag Candy.app to Applications, then System Settings → Privacy & Security → Open Anyway. Linux and the rest: README → Install.

          Built by GitHub from commit ${GITHUB_SHA::7}, in the open: $run. To check a download, compare its SHA256 (PowerShell: \`Get-FileHash the-file\`; macOS: \`shasum -a 256 the-file\`):

          \`\`\`
          $sums
          \`\`\`"
