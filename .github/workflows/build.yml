name: Build

# Proves the source builds: runs the tests and builds the Windows installer the
# way install.cmd does on a user's PC, on every push and pull request. Nothing
# is published or kept: Candy ships as source, and each user compiles their
# own (README → Install), so what they run is the code they can read here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # Three files carry the version and they drift silently.
      - name: Check every version agrees
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          if ($conf -ne $pkg -or $conf -ne $cargo) { throw "the versions disagree" }

      - name: Build the installer
        run: npm run pack
