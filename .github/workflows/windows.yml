name: Windows

# Builds the installer on every `v*` tag (and on demand), runs the tests, and
# publishes a GitHub release for each tag while PUBLISH is 'true'.
#
# Releases go out unsigned until SignPath Foundation approves the project (it
# only takes projects that are already released; see the "Sign" step). For a
# crypto audience an unsigned .exe looks like exactly the kind of wallet
# drainer people are warned about, so the notes say it is unsigned, how to get
# past SmartScreen, and the installer's SHA-256 to check it against.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLISH: 'true'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # Three files carry the version and they drift silently.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      # ── Sign ──────────────────────────────────────────────────────────────
      # Pick one and fill in the secrets:
      #  • SignPath Foundation — free code signing for open-source projects
      #    (https://signpath.org), via signpath/github-action-submit-signing-request.
      #  • Azure Artifact Signing (Trusted Signing) — paid monthly, via
      #    azure/trusted-signing-action.
      #  • An OV/EV certificate — signtool sign /fd sha256 /tr <timestamp url> …
      # Sign both target/release/trader-companion.exe and the setup .exe.

      - uses: actions/upload-artifact@v4
        with:
          name: TraderCompanion-Windows-setup
          path: release/TraderCompanion-Windows-${{ steps.pack.outputs.version }}-setup.exe
          retention-days: 7

      - name: Publish the release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $file = "release/TraderCompanion-Windows-$v-setup.exe"
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash
          $repo = "https://github.com/${{ github.repository }}"
          $notes = @(
            "Trader Companion $v for Windows. Reads public market data only; never asks for a wallet, a seed phrase or a private key, and cannot trade.",
            "",
            "**This installer is not code-signed yet**: Windows SmartScreen will say ""Windows protected your PC"". Click **More info → Run anyway**. Signing is free through SignPath Foundation once they approve the project: $repo#code-signing-policy",
            "",
            "Built from this repository by the Windows workflow on GitHub's machines; nothing here was uploaded by hand. Check the file before running it: ``Get-FileHash <the installer>`` in PowerShell must print",
            "",
            "SHA-256: ``$sha``"
          ) -join "`n"
          gh release create "${{ github.ref_name }}" $file --title "Trader Companion $v" --notes $notes
