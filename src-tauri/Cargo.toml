[package]
name = "trader-companion"
description = "Candy — Trader Companion: a mascot at the top of your screen that watches your memecoins"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "trader_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent window on macOS (macOSPrivateApi in
# tauri.conf.json); nothing changes on Windows or Linux.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The voice chat's recording, base64 over the IPC, decoded before it goes to OpenAI.
base64 = "0.22"
# Read-only Solana RPC calls for the wallets tab (see solana_rpc in lib.rs).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
# The session bus, where media players announce what they play (MPRIS): the dance.
dbus = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Alert notifications with buttons (Open, Mute 1 h): already built for the
# notification plugin, used directly for the buttons it doesn't offer.
tauri-winrt-notification = "0.8"
# ApplicationModel: the Store package's identity, notification id and
# "Start with Windows" task (platform/windows.rs).
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
